<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹스토리 통합 분배 대시보드</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="config.js"></script>
    <script defer src="app.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>📚 웹스토리 통합 분배 대시보드</h1>
        <p style="color: var(--text-sub); margin: 0;">작품 등록 및 하드웨어 구성 커스텀 패널</p>
    </header>

    <div class="input-section">
        <div class="accordion-toggle" onclick="toggleConfigPanel()">
            <span>⚙️ PC 그룹 및 계정 범위 설정 (클릭하여 열기/접기)</span>
            <span id="accordionArrow">▼</span>
        </div>
        <div class="accordion-content" id="configPanel">
            <div class="config-grid" id="configContainer"></div>
            
            <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                <button type="button" class="btn-add-group" onclick="addConfigGroupUI()">➕ PC 그룹 추가</button>
                <p style="font-size: 11px; color:#64748b; margin: 0;">※ 설정값은 브라우저에 자동 저장되며 신규 등록 시 반영됩니다.</p>
            </div>
        </div>

        <div class="grid-inputs">
            <div class="form-group">
                <label for="title">작품명</label>
                <input type="text" id="title" placeholder="예: 나 혼자만 만렙" value="">
            </div>
            <div class="form-group">
                <label for="payStart">유료 시작 화수</label>
                <input type="number" id="payStart" value="1" min="1">
            </div>
            <div class="form-group">
                <label for="payEnd">유료 종료 화수</label>
                <input type="number" id="payEnd" value="4" min="1">
            </div>
            <div class="form-group">
                <label for="tickets">계정당 이용권 수</label>
                <input type="number" id="tickets" value="1" min="1">
            </div>
        </div>
        <button class="btn-submit" onclick="addArtwork()">새 작품 등록 및 자동 분배</button>
    </div>

    <div class="section-title">
        <span>⏳ 열람 진행 중인 작품</span>
        <span class="count-badge" id="ongoingCount">0개</span>
    </div>
    <div class="card-grid" id="ongoingGrid"></div>

    <div class="section-title" style="margin-top: 50px;">
        <span>✅ 완전히 완료된 작품</span>
        <span class="count-badge" id="completedCount">0개</span>
    </div>
    <div class="card-grid completed-section" id="completedGrid"></div>
</div>

</body>
</html>
